name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Guard (zero-dep, no shell, no path escapes)
        run: node scripts/guard.mjs
      - name: Unit tests
        run: node --test
      - name: Smoke (fixtures through the real entrypoint)
        run: node scripts/smoke.mjs

  validate:
    runs-on: ubuntu-latest
    continue-on-error: true # the CLI may not be installable in CI; don't fail the build on that
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin (strict)
        run: claude plugin validate ./plugins/claude-nudge --strict
